# =============================================================================
# Landroid dashboard additions for /config/configuration.yaml
#
# Paste BOTH blocks below at the TOP LEVEL of configuration.yaml
# (e.g. next to the other !include integrations at the bottom of the file).
#
# Prerequisites (see the repo README):
#   /config/themes/worx.yaml            (manual copy; HACS installs it as
#                                       /config/themes/worx/worx.yaml – either works)
#   /config/lovelace-landroid.yaml      (from lovelace-landroid.yaml in this repo)
#
# After pasting: Developer Tools -> YAML -> Check configuration, then restart.
# Rollback: delete both blocks and restart.
# =============================================================================

# 1) Custom themes — loads every YAML file anywhere under /config/themes/
#    (recursively) as a theme; the "worx" theme lives there as either
#    themes/worx.yaml (manual copy) or themes/worx/worx.yaml (HACS install).
frontend:
  themes: !include_dir_merge_named themes

# 2) The Landroid dashboard — YAML mode, shown in the sidebar.
#    `mode: storage` keeps every existing UI-created dashboard untouched;
#    the `dashboards` map only adds this one new YAML-mode dashboard.
#    Its views come from /config/lovelace-landroid.yaml.
lovelace:
  mode: storage
  dashboards:
    landroid-dashboard:
      mode: yaml
      title: Landroid
      icon: mdi:robot-mower
      filename: lovelace-landroid.yaml
      show_in_sidebar: true
